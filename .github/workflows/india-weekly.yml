# Weekly India district outbreak forecast (india-epiclim-v2).
# Every Monday: fetch the latest NASA POWER daily weather for the 640 district centroids, run the trained models
# (code and model bundle on the pipeline-data branch) and load the forecast into EpiRadar through the
# token-protected /api/public/ingest route.
# Setup: add the repository secret INGEST_TOKEN (the same value as the app's INGEST_TOKEN secret) and, optionally,
# the repository variable EPIRADAR_URL (defaults to https://epiradar.lovable.app).
name: India weekly forecast

on:
  schedule:
    - cron: '23 1 * * 1' # Monday 06:53 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: india-weekly
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_TOKEN: ${{ secrets.INGEST_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pipeline-data

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements-weekly.txt

      - name: Install
        run: pip install -r pipeline/requirements-weekly.txt

      - name: Fetch NASA POWER weather and forecast every district
        run: python pipeline/scripts/weekly_india.py --runtime runtime/india-epiclim-v2 --fetch --out out/weekly

      - name: Load the forecast into EpiRadar
        if: env.HAS_TOKEN == 'true'
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          EPIRADAR_URL: ${{ vars.EPIRADAR_URL || 'https://epiradar.lovable.app' }}
        run: python pipeline/scripts/weekly_india.py --runtime runtime/india-epiclim-v2 --daily out/weekly/daily_weather.parquet --out out/weekly --ingest

      - name: Loading skipped
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning title=Forecast not loaded::Add the repository secret INGEST_TOKEN (same value as the app's INGEST_TOKEN) so the weekly forecast is loaded into EpiRadar. The forecast files are attached to this run."

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: india-forecast-${{ github.run_number }}
          path: out/weekly
          retention-days: 90
          if-no-files-found: ignore
